<text x="56" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="68" font-weight="600" fill="#202C31" text-anchor="start">让琴谱与演奏</text>
